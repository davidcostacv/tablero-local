<!doctype html>
<html lang="es" data-build="2026-11-05.3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tablero">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Tablero</title>
<!-- Tabler (https://github.com/tabler/tabler, MIT): CSS servido desde este mismo servidor, sin CDN. -->
<link rel="stylesheet" href="/vendor/tabler/tabler.min.css">
<script>/* tema antes de pintar (Tabler usa data-bs-theme); sin preferencia guardada sigue al sistema */(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t)})()</script>
<style>
/* Colores y medidas = los de Tabler. Estos alias los usan los componentes propios del tablero; se declaran también en
   [data-bs-theme] para que dentro de la barra lateral (siempre oscura, como en Tabler) se resuelvan con el tema oscuro. */
:root,[data-bs-theme]{
  --bg:var(--tblr-body-bg);--side:var(--tblr-gray-800);--card:var(--tblr-bg-surface);--card-2:var(--tblr-bg-surface);--line:var(--tblr-border-color);--line-2:var(--tblr-border-color-translucent);--hover:var(--tblr-active-bg);--active:var(--tblr-bg-surface);
  --text:var(--tblr-body-color);--muted:var(--tblr-secondary);--faint:color-mix(in oklab,var(--tblr-secondary) 55%,transparent);
  --accent:var(--tblr-primary);--accent-soft:color-mix(in oklab,var(--tblr-primary) 12%,transparent);--accent-ink:var(--tblr-primary);
  --green:var(--tblr-green);--green-soft:color-mix(in oklab,var(--tblr-green) 14%,transparent);--red:var(--tblr-red);--red-soft:color-mix(in oklab,var(--tblr-red) 14%,transparent);--blue:var(--tblr-primary);--blue-soft:color-mix(in oklab,var(--tblr-primary) 12%,transparent);
  --overlay:rgba(0,0,0,.45);--shadow:0 24px 70px rgba(0,0,0,.25);--c2:var(--tblr-azure);--radius:var(--tblr-border-radius-lg);--radius-sm:var(--tblr-border-radius);
  --a0:var(--tblr-blue);--a1:var(--tblr-orange);--a2:var(--tblr-green);--a3:var(--tblr-purple);--a4:var(--tblr-yellow);--a5:var(--tblr-teal);--a6:var(--tblr-pink);--a7:var(--tblr-gray-500)
}
/* "only light": si Chrome tiene el modo oscuro forzado, sin esto ignora el tema claro elegido (light-dark() saldría oscuro) */
:root[data-bs-theme=light],[data-bs-theme=light]{color-scheme:only light}
*{box-sizing:border-box}
html{overflow-x:clip}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--tblr-font-sans-serif);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- shell ---------- */
/* barra lateral vertical oscura al estilo Tabler (navbar-vertical, data-bs-theme="dark") */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;position:relative}
/* fondo de la columna lateral a toda la altura de la página (la barra en sí es sticky de 100vh) */
.app::before{content:"";position:absolute;left:0;top:0;bottom:0;width:260px;background:var(--side);pointer-events:none}
.side{background:var(--side);color:var(--text);padding:16px 12px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:1}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--text)}
.brand .avatar{background:var(--tblr-primary);color:#fff;font-weight:700}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.side .nav{flex-direction:column;flex-wrap:nowrap;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border-radius:var(--radius-sm);color:var(--muted);font-size:14px;position:relative}
.nav button:hover{background:color-mix(in oklab,var(--text) 6%,transparent);color:var(--text)}
.nav button[aria-current]{background:color-mix(in oklab,var(--text) 9%,transparent);color:var(--text);font-weight:var(--tblr-font-weight-medium)}
.nav button[aria-current]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .lbl{flex:1}
.nav .badge{margin-left:auto;font-variant-numeric:tabular-nums}
.grp{font-size:.75rem;font-weight:var(--tblr-font-weight-medium);color:var(--muted);padding:20px 12px 6px;letter-spacing:.04em;text-transform:uppercase}
.nav .area svg{stroke:var(--c)}
.rec button{display:block;width:100%;height:34px;line-height:34px;padding:0 12px;color:var(--muted);font-size:13.5px;border-radius:var(--radius-sm)}
.rec button:hover{background:color-mix(in oklab,var(--text) 6%,transparent);color:var(--text)}
.side .foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:4px}
.side .foot .sync{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;padding:4px 6px;border-radius:6px;text-align:right}
.side .foot .sync:hover{background:var(--hover);color:var(--text)}
.side .foot .sync.bad{color:var(--red)}
.ibtn{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:color-mix(in oklab,var(--text) 7%,transparent);color:var(--text)}

/* cabecera (navbar de Tabler) y encabezado de página (page-header / page-pretitle / page-title) */
.main{min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:10px;padding:0 32px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;position:sticky;top:0;background:var(--card);box-shadow:var(--tblr-shadow-card);z-index:5}
.top .crumb{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top .crumb span{color:var(--text);font-weight:var(--tblr-font-weight-medium)}
.burger{display:none}
.gbtn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:var(--tblr-font-weight-medium);white-space:nowrap;box-shadow:var(--tblr-shadow-input)}
.gbtn:hover{border-color:var(--faint);background:color-mix(in oklab,var(--text) 4%,var(--card))}
.content{padding:28px 32px 80px;max-width:1320px;width:100%}
.hero .date{display:flex;align-items:center;gap:6px}
.hero .date .ibtn{width:26px;height:26px}
.hero .lede{margin:4px 0 0;text-wrap:balance}
.bar{display:flex;align-items:flex-end;gap:16px;margin:24px 0 24px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:24px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:8px;padding:2px 0 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:var(--tblr-font-weight-medium)}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:7px 12px;width:280px;color:var(--muted);margin-bottom:10px;box-shadow:var(--tblr-shadow-input)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 .25rem var(--accent-soft)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--text);font-size:14px}
.search input::placeholder{color:var(--muted)}

/* ---------- cards (la clase .card es la de Tabler: fondo, borde, radio y sombra; aquí solo el relleno) ---------- */
.card{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:8px 0 12px}
.kpi .f{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-height:24px;flex-wrap:wrap}
/* .pill = badge de Tabler (bg-*-lt); aquí solo el icono */
.pill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill svg{width:12px;height:12px;stroke-width:2.2}
.two{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;margin-top:16px}
.card h2{font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:10px;line-height:1.4}
.card .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.head{display:flex;align-items:baseline;gap:10px;margin:18px 0 14px}
.head .big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.head .of{color:var(--muted);font-size:14px}
.lgd{display:flex;gap:20px;color:var(--muted);font-size:13.5px;margin-bottom:14px}
.lgd span{display:flex;align-items:center;gap:8px}
.lgd i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart{min-height:0;height:160px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;align-items:end;border-bottom:1px solid var(--line);padding:0 8px}
.chart .g{display:flex;gap:6px;align-items:end;justify-content:center;height:100%;position:relative;padding-bottom:22px}
.chart .b{width:22px;border-radius:7px 7px 2px 2px;min-height:3px;background:var(--accent)}
.chart .b.c{background:var(--blue)}
.chart .b.cur{background-color:var(--accent-soft);background-image:radial-gradient(var(--accent) .8px,transparent .9px);background-size:4px 4px;border:1.5px solid var(--accent)}
.chart .x{position:absolute;bottom:0;font-size:12px;color:var(--muted);white-space:nowrap}
.card.fill{display:flex;flex-direction:column}.card.fill .chart{margin-top:auto}

/* today rows */
.todo{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.trow{display:flex;gap:14px;align-items:flex-start;padding:8px 0}
.trow .cb{appearance:none;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:7px;margin:2px 0 0;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--card-2)}
.trow .cb:checked{background:var(--accent);border-color:var(--accent)}
.trow .cb:checked::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.trow .body{flex:1;min-width:0}
.trow .t{font-weight:600;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere;text-align:left;width:100%}
.trow .t:hover{color:var(--accent-ink)}
.trow.done .t{color:var(--muted);text-decoration:line-through;font-weight:500}
.trow .m{color:var(--muted);font-size:14px;margin-top:2px}
.trow .m .late{color:var(--red)}
.more{display:inline-block;margin-top:14px;color:var(--muted);font-size:14.5px}
.more:hover{color:var(--text)}
.empty-note{color:var(--muted);font-size:14px;padding:10px 0}

/* detail / forms */
.detail{margin:10px 0 6px;padding:16px;background:var(--tblr-bg-surface-secondary);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:12px;font-size:14px}
.detail .notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.detail .src{color:var(--muted);font-size:13.5px;display:flex;gap:14px;flex-wrap:wrap}
.detail form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.detail form .full{grid-column:1/-1}
/* .field = form-control / form-select de Tabler (los agrega el helper el()) */
.field{min-width:0;width:100%}
textarea.field{resize:vertical;min-height:64px}
.acts{display:flex;gap:12px;align-items:center;grid-column:1/-1}
.lbtn{color:var(--muted);font-size:14px}.lbtn:hover{color:var(--text)}.lbtn.danger:hover{color:var(--red)}

/* quick add */
.add{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px 8px 16px;margin-bottom:16px;box-shadow:var(--tblr-shadow-card)}
.add>svg{color:var(--muted)}
.add input,.add select{border:0;background:none;outline:0;padding:8px 4px;font-size:15px;min-width:0;color:var(--text)}
.add input::placeholder{color:var(--muted)}
.add .t{flex:1}
.add .meta{display:flex;gap:4px;align-items:center}
.add .meta input,.add .meta select{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 8px;background:var(--card-2)}
.add .meta input:focus,.add .meta select:focus{border-color:var(--blue);color:var(--text)}
.add .meta input[type=text]{width:110px}.add .meta input[type=date]{width:140px}

/* settings row (ref 2) */
.setrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;color:var(--muted);box-shadow:var(--tblr-shadow-card)}
.setrow .tx{flex:1;min-width:0}
.setrow .tx b{display:block;color:var(--text);font-weight:600;font-size:15px}
.setrow .tx span{font-size:13.5px}
.sw{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(18px)}

/* table (ref 2) */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--tblr-shadow-card)}
.tcard .cap{padding:16px 22px 6px;font-size:16px;font-weight:600}
/* tablas como .table.card-table de Tabler: cabecera en mayúsculas pequeñas sobre fondo terciario */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:var(--tblr-font-weight-medium);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 16px;background:var(--tblr-bg-surface-tertiary);border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:22px}th:last-child,td:last-child{padding-right:22px}
td{padding:0 16px;height:50px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.r:hover td{background:var(--hover)}
td.name{white-space:normal;max-width:0;width:50%}
td.name .nm{display:flex;align-items:center;gap:10px}
td.name button{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:var(--text);font-weight:500}
td.name button svg{color:var(--muted)}
td.name button .ell{flex:0 1 auto}
td.name button .ell .pill{margin-left:8px;vertical-align:middle}
td.name button:hover .ell{color:var(--accent-ink)}
tr.r.done td.name .ell{color:var(--muted);text-decoration:line-through}
.st{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--faint)}
.dot.doing{background:var(--accent)}.dot.blocked{background:var(--red)}.dot.done{background:var(--green)}.dot.todo{background:var(--blue)}.dot.idea{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
td.d{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
td.d.late{color:var(--red)}
th.r{text-align:right}
tr.dt td{height:auto;white-space:normal;padding:0 22px 14px;background:none}
tr.dt:hover td{background:none}
.sec{font-size:13px;font-weight:600;color:var(--muted);padding:18px 22px 4px;letter-spacing:.02em}
.tcard .todo{padding:0 22px 16px;margin-top:4px}

/* charts (SVG) */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.charts .wide{grid-column:1/-1}
svg.ch{width:100%;display:block;overflow:visible;font:12px Inter,"Segoe UI",system-ui,sans-serif}
.cbox{width:100%;min-height:40px}
svg.ch text{fill:var(--muted)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .bar{rx:4}
svg.ch .lbl{fill:var(--text);font-weight:600}
.ch-wrap{margin-top:14px}
.hbar{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:14px}
.hbar .nm{width:120px;color:var(--text);text-align:right;flex:none}
.hbar .tr{flex:1;height:10px;background:var(--line-2);border-radius:99px;overflow:hidden}
.hbar .fl{height:100%;border-radius:99px}
.hbar .n{width:28px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.donut{display:flex;align-items:center;gap:24px;margin-top:14px;flex-wrap:wrap}
.donut svg{width:140px;height:140px;flex:none}
.donut .lg{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.donut .lg span{display:flex;align-items:center;gap:8px}
.donut .lg b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.sparkrow{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.sparkrow .cbox{flex:1 1 180px}
/* whatsapp */
.wa{display:inline-flex;align-items:center;gap:6px;color:#1f9d55;font-size:13px;font-weight:600;white-space:nowrap}
.wa svg{width:16px;height:16px}
.wa:hover{text-decoration:none;filter:brightness(1.1)}
.wabtn{display:inline-flex;align-items:center;gap:8px;background:#22a55b;color:#fff;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.wabtn:hover{text-decoration:none;filter:brightness(1.06)}
.wabtn svg{width:16px;height:16px}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:20px}
.contact{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;width:100%;box-shadow:var(--tblr-shadow-card)}
.contact>button{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.contact .av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.contact .tx{flex:1;min-width:0}
.contact .tx b{display:block;font-weight:600;font-size:15px}
.contact .tx span{font-size:13px;color:var(--muted)}
.contact[aria-current]{border-color:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);background:var(--card);margin-bottom:20px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .btn{margin-top:12px}
.compose{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:start;margin-bottom:20px}
.compose textarea{min-height:42px}
.prev{display:flex;align-items:flex-start;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.prev input{margin-top:4px;accent-color:var(--accent)}
.prev .tx{flex:1;min-width:0}
.prev .tx span{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.prev .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prevacts{display:flex;gap:16px;align-items:center;padding:14px 22px}
@media(max-width:900px){.charts{grid-template-columns:1fr}.compose{grid-template-columns:1fr}}

/* palette */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.ov.open{display:flex}
.pal{width:100%;max-width:680px;max-height:78vh;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.pal form{display:flex;align-items:center;gap:12px;padding:6px 20px;border-bottom:1px solid var(--line)}
.pal form svg{color:var(--muted)}

.pal .sug svg{color:var(--muted)}

.ex{padding:8px 10px 12px;border-bottom:1px solid var(--line-2)}
.ex:last-child{border-bottom:0}
.ex .q{color:var(--muted);font-size:14px;padding:4px 0}

  if(t.images&&t.images.length){var th=el('div','thumbs');t.images.forEach(function(p){var bt=el('button');bt.type='button';bt.title='Ver imagen completa';var im=el('img');im.src=imgUrl(p);im.alt='Imagen de '+t.title;im.loading='lazy';bt.appendChild(im);bt.onclick=function(){lightbox(imgUrl(p))};th.appendChild(bt)});b.appendChild(th)}
  var ac=el('div','ag-acts');
  var up=el('label','lbtn','+ Imagen');up.style.cursor='pointer';var fi=el('input');fi.type='file';fi.accept='image/png,image/jpeg,image/webp,image/gif';fi.multiple=true;fi.hidden=true;fi.onchange=function(){agAct(uploadImages(t.id,fi.files))};up.appendChild(fi);ac.appendChild(up);
  if(agConfirm[t.id]){ac.appendChild(el('span','confirm','¿Borrar esta tarea'+(t.images&&t.images.length?' y sus imágenes':'')+'?'));
    var y=el('button','lbtn danger','Sí, borrar');y.type='button';y.onclick=function(){delete agConfirm[t.id];agAct(api('DELETE','/api/agenda/'+encodeURIComponent(t.id)))};
    var no=el('button','lbtn','Cancelar');no.type='button';no.onclick=function(){delete agConfirm[t.id];render()};ac.append(y,no)}
  else{var del=el('button','lbtn danger','Borrar');del.type='button';del.onclick=function(){agConfirm[t.id]=true;render()};ac.appendChild(del)}
  b.appendChild(ac);r.appendChild(b);return r}
// El formulario se crea una sola vez y se reutiliza: los refrescos automáticos no borran lo que estás escribiendo.
function agendaForm(){
  if(agFormEl)return agFormEl;
  var f=el('form','card agf');f.setAttribute('aria-label','Nueva tarea');
  var ti=el('input','field ttl');ti.type='text';ti.placeholder='Nueva tarea…';ti.required=true;ti.maxLength=200;ti.setAttribute('aria-label','Título');
  var r1=el('div','agrow'),seg=el('div','seg'),btns={},du=el('input','field w'),dl=el('input');du.type='date';du.setAttribute('aria-label','Fecha');dl.type='checkbox';
  function paint(){var d=agToday();btns.hoy.setAttribute('aria-pressed',String(!dl.checked&&du.value===d));btns.man.setAttribute('aria-pressed',String(!dl.checked&&du.value===agAddDays(d,1)));btns.sin.setAttribute('aria-pressed',String(!dl.checked&&!du.value));du.disabled=dl.checked;seg.style.opacity=dl.checked?'.5':''}
  [['hoy','Hoy'],['man','Mañana'],['sin','Sin fecha']].forEach(function(o){var b=el('button',null,o[1]);b.type='button';b.setAttribute('aria-pressed','false');b.onclick=function(){var d=agToday();dl.checked=false;du.value=o[0]==='hoy'?d:o[0]==='man'?agAddDays(d,1):'';paint()};btns[o[0]]=b;seg.appendChild(b)});
  du.oninput=paint;
  var ca=el('select','field w');ca.setAttribute('aria-label','Categoría');CATS.forEach(function(c){var o=el('option',null,c[1]);o.value=c[0];ca.appendChild(o)});
  var cl=el('input','field w');cl.type='text';cl.placeholder='Cliente';cl.maxLength=80;cl.setAttribute('aria-label','Cliente');cl.setAttribute('list','ag-clients');var dlist=el('datalist');dlist.id='ag-clients';
  r1.append(seg,du,ca,cl,dlist);
  var r2=el('div','agrow'),bus={};BU.forEach(function(x){var l=el('label','chk'),c=el('input');c.type='checkbox';bus[x[0]]=c;l.title=x[0];l.append(c,document.createTextNode(x[1]));r2.appendChild(l)});
  var ld=el('label','chk');ld.append(dl,document.createTextNode('Todos los días'));dl.onchange=paint;r2.appendChild(ld);
  var no=el('textarea','field');no.placeholder='Notas (puede incluir un mensaje para copiar y pegar en WhatsApp)';no.rows=2;no.setAttribute('aria-label','Notas');
  var r3=el('div','agrow'),fl=el('input','file'),sp=el('span'),msg=el('span','empty-note'),go=el('button','pbtn','Agregar');fl.type='file';fl.multiple=true;fl.accept='image/png,image/jpeg,image/webp,image/gif';fl.setAttribute('aria-label','Imágenes (capturas)');sp.style.flex='1';msg.style.padding='0';go.type='submit';r3.append(fl,sp,msg,go);
  f.append(ti,r1,r2,no,r3);
  f.onsubmit=function(e){e.preventDefault();
    var body={title:ti.value,date:dl.checked?null:(du.value||null),daily:dl.checked,category:ca.value,client:cl.value.trim()||null,bureaus:BU.filter(function(x){return bus[x[0]].checked}).map(function(x){return x[0]}),notes:no.value};
    go.disabled=true;msg.textContent='Guardando…';
    api('POST','/api/agenda',body).then(function(t){return uploadImages(t.id,fl.files)}).then(function(){ti.value='';no.value='';cl.value='';fl.value='';dl.checked=false;Object.keys(bus).forEach(function(k){bus[k].checked=false});du.value=agToday();paint();msg.textContent='Agregada.';setTimeout(function(){msg.textContent=''},1500);ti.focus();return loadAgenda()})
      .catch(function(e){msg.textContent='Error: '+e.message}).then(function(){go.disabled=false})};
  f._paint=paint;f._clients=dlist;f._date=du;du.value=agToday();agFormEl=f;return f}
function bureauCard(){
  var g=agGroups(agenda.tasks),by=dict();
  g.late.concat(g.today).forEach(function(t){if(!t.bureaus||!t.bureaus.length)return;var r=by[t.client||'Sin cliente']=by[t.client||'Sin cliente']||{};t.bureaus.forEach(function(b){r[b]=r[b]==='open'?'open':agDone(t)?'done':'open'})});
  var c=el('div','card');c.appendChild(el('h2',null,'Burós por cliente (hoy)'));c.appendChild(el('div','sub','Qué buró toca con cada cliente hoy (incluye lo atrasado).'));
  var names=Object.keys(by).sort(function(a,b){return (a==='Sin cliente')-(b==='Sin cliente')||a.localeCompare(b)});
  if(!names.length){c.appendChild(el('div','empty-note','Ninguna tarea de hoy tiene burós.'));return c}
  var tb=el('table','bt'),hd=el('thead'),hr=el('tr'),bd=el('tbody');tb.style.marginTop='14px';hr.appendChild(el('th',null,'Cliente'));BU.forEach(function(x){var th=el('th','c',x[1]);th.title=x[0];hr.appendChild(th)});hd.appendChild(hr);tb.appendChild(hd);
  names.forEach(function(n){var tr=el('tr');tr.appendChild(el('td',null,n));BU.forEach(function(x){var s=by[n][x[0]],td=el('td','c'+(s==='open'?' dot':s==='done'?' ok':''),s==='open'?'●':s==='done'?'✓':'');if(s)td.title=x[0]+(s==='open'?': pendiente':': hecho');tr.appendChild(td)});bd.appendChild(tr)});
  tb.appendChild(bd);c.appendChild(tb);var lg=el('div','sub','● pendiente · ✓ hecho');lg.style.fontSize='13px';lg.style.marginTop='10px';c.appendChild(lg);return c}
function agendaView(v){
  if(!agenda){v.appendChild(el('div','empty-note',agendaErr?'No se pudo cargar la agenda: '+agendaErr:'Cargando la agenda…'));if(!agendaErr)loadAgenda();return}
  var f=agendaForm();f._clients.textContent='';Object.keys(agenda.tasks.reduce(function(o,t){if(t.client)o[t.client]=1;return o},dict())).sort().forEach(function(n){var o=el('option');o.value=n;f._clients.appendChild(o)});f._paint();v.appendChild(f);
  var all=agenda.tasks.filter(agMatch),g=agGroups(all),grid=el('div','ag-grid'),w=el('div','tcard');w.style.marginBottom='0';
  function block(name,list,cls,empty,dates){w.appendChild(el('div','ag-sec'+(cls?' '+cls:''),name+' · '+list.length));var l=el('div','ag-list'),last='';if(!list.length)l.appendChild(el('div','empty-note',empty));
    list.forEach(function(t){if(dates&&t.date!==last){last=t.date;l.appendChild(el('div','ag-date',agFmt(t.date)))}l.appendChild(agRow(t,cls==='late'))});w.appendChild(l)}
  if(g.late.length)block('Atrasado',g.late,'late','');
  block('Hoy',g.today,'',query?'Nada coincide.':'Nada para hoy.');
  block('Próximos días',g.upcoming,'','Nada programado.',true);
  block('Sin fecha',g.undated,'','Nada sin fecha.');
  var det=el('details','ag-done');det.open=agShowDone;det.ontoggle=function(){agShowDone=det.open};det.appendChild(el('summary','ag-sec','Hechas · '+g.done.length+(g.done.length>=30?' (últimas 30)':'')));
  var dl=el('div','ag-list');if(!g.done.length)dl.appendChild(el('div','empty-note','Nada hecho todavía.'));g.done.forEach(function(t){dl.appendChild(agRow(t))});det.appendChild(dl);w.appendChild(det);
  grid.appendChild(w);section('burós por cliente',grid,bureauCard);v.appendChild(grid);
  var tz=el('div','sub','Hoy en la agenda: '+agFmt(agenda.today)+' ('+agenda.tz+').');tz.style.fontSize='13px';tz.style.marginTop='14px';v.appendChild(tz);
}
function agendaWidget(){var n=agCounts();if(!n)return null;
  var b=el('button','card agw');b.type='button';b.setAttribute('aria-label','Abrir la agenda: '+n.today+' para hoy, '+n.late+' atrasadas');b.onclick=function(){go('agenda')};b.appendChild(svg('cal'));
  var t=el('div','ttl');t.appendChild(el('b',null,'Agenda'));t.appendChild(el('div','k',n.today||n.late?'Toca hoy':'Todo al día'));b.appendChild(t);b.appendChild(el('span','sp'));
  var a=el('div','cnt');a.appendChild(el('div','n',String(n.today)));a.appendChild(el('div','k','Hoy'));

function render(){
  section('barra lateral',null,sidebar);section('cabecera',null,header);section('pestañas',null,tabsBar);
  var v=$('view');v.textContent='';
  section(LABEL[tab]||tab,v,function(){tab==='summary'?summary(v):tab==='agenda'?agendaView(v):tab==='whatsapp'?whatsappView(v):tab==='settings'?settingsView(v):typeView(v)});
}

/* ---------- palette ---------- */
var SUGGEST=['¿Qué tengo atrasado?','¿Qué vence esta semana?','Proyectos en curso','Resumen general','¿Qué hice esta semana?','Tareas sin fecha','Agrega una tarea: llamar al banco el viernes'];
function openPal(){$('ov').classList.add('open');$('ask-btn').setAttribute('aria-expanded','true');paintPal();$('ask-in').focus()}
function closePal(){$('ov').classList.remove('open');$('ask-btn').setAttribute('aria-expanded','false')}
function paintPal(){
  var b=$('pal-body');b.textContent='';
  if(!history.length){b.appendChild(el('div','hint','Sugerencias'));SUGGEST.forEach(function(s){var x=el('button','sug');x.appendChild(svg('ask','s'));x.appendChild(el('span',null,s));x.onclick=function(){askSend(s)};b.appendChild(x)});return}
  history.forEach(function(h){
    var ex=el('div','ex');ex.appendChild(el('div','q','› '+h.q));
    if(!h.r){ex.appendChild(el('div','a wait','Pensando…'));b.appendChild(ex);return}
    ex.appendChild(el('div','a',h.r.answer));
    if(h.r.items&&h.r.items.length){var box=el('div','todo');h.r.items.slice(0,10).forEach(function(c){var it=items.find(function(x){return x.id===c.id})||c;box.appendChild(trow(it,{rerender:paintPal}))});ex.appendChild(box)}
    b.appendChild(ex);
  });
  b.scrollTop=b.scrollHeight;
}
function askSend(q){
  q=(q||'').trim();if(!q)return;
  var h={q:q,r:null};history.push(h);if(history.length>8)history.shift();$('ask-in').value='';paintPal();
  api('POST','/api/agent',{question:q}).then(function(r){h.r=r;if(r.created||r.changed)return load().then(paintPal);paintPal()})
    .catch(function(e){h.r={answer:'No pude consultar al tablero ('+e.message+'). ¿Está corriendo el servidor?',items:[]};paintPal()});
}

/* ---------- boot ---------- */
try{
setIcon($('s-ico'),'search');setIcon($('p-ico'),'ask');setIcon($('a-ico'),'ask');icoBtn($('burger'),'menu');icoBtn($('refresh'),'refresh');icoBtn($('ask-side'),'ask');
var root=document.documentElement;
function isDark(){return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
// Tabler cambia de tema con data-bs-theme en <html>; sin preferencia guardada sigue al sistema.
function paintTheme(){root.setAttribute('data-bs-theme',isDark()?'dark':'light');icoBtn($('theme'),isDark()?'sun':'moon');$('theme').setAttribute('aria-label',isDark()?'Usar tema claro':'Usar tema oscuro')}
try{var th=localStorage.getItem('theme');if(th)root.dataset.theme=th}catch(e){}
$('theme').onclick=function(){root.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}paintTheme()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paintTheme);paintTheme();
icoBtn($('settings-btn'),'gear');$('settings-btn').onclick=function(){go('settings')};
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))navigator.serviceWorker.register('/sw.js').catch(function(){});
$('burger').onclick=function(){var o=$('side').classList.toggle('open');$('scrim').classList.toggle('open',o);$('burger').setAttribute('aria-expanded',String(o))};
$('scrim').onclick=closeSide;$('refresh').onclick=function(){load()};
var qt;$('q').oninput=function(){clearTimeout(qt);var v=this.value.trim().toLowerCase();qt=setTimeout(function(){query=v;render()},120)};
$('ask-btn').onclick=openPal;$('ask-side').onclick=function(){closeSide();openPal()};$('ask-form').onsubmit=function(e){e.preventDefault();askSend($('ask-in').value)};
$('ov').onclick=function(e){if(e.target===$('ov'))closePal()};
document.addEventListener('keydown',function(e){
  var open=$('ov').classList.contains('open');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open?closePal():openPal();return}
  if(e.key==='/'&&!typing()&&!open){e.preventDefault();openPal();return}
  if(e.key==='Escape'){closeSide();closePal();var lb=$('lb');if(lb)lb.classList.remove('open')}
});
if(location.hash==='#agenda'){tab='agenda';sub='list'}// enlace del recordatorio diario (toast)
// Primero la carcasa con lo que haya (nav, fecha, pestañas); luego los datos. Si el API falla, la página sigue usable y avisa.
render();load();setInterval(function(){if(!typing()&&!$('ov').classList.contains('open'))load()},15000);
}catch(e){fatal(e)}
})();
