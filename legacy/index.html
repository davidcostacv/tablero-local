<title>Tablero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: columna lateral de estado + rejilla de paneles; el resumen del día manda arriba */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15212b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#0e7a6b; --accent-soft:#dcf1ed; --warn:#b4540a; --warn-soft:#fbead9; --ok:#1d7a3a;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#18222b; --ink:#e8eef3; --muted:#92a1ae; --line:#27333e;
  --accent:#3ec9b3; --accent-soft:#12332f; --warn:#f0a35e; --warn-soft:#3a2a18; --ok:#5fd07f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222b; --ink:#e8eef3; --muted:#92a1ae; --line:#27333e;
  --accent:#3ec9b3; --accent-soft:#12332f; --warn:#f0a35e; --warn-soft:#3a2a18; --ok:#5fd07f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font:700 clamp(26px,5vw,38px)/1.1 var(--f-display);margin:0;text-wrap:balance}
.date{color:var(--muted);text-transform:capitalize}
.stamp{font:400 12px var(--f-mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
@media(max-width:820px){.span-8,.span-4,.span-6{grid-column:span 12}}
h2{font:600 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.brief{background:var(--accent-soft);border-color:transparent}
.brief h2{color:var(--accent)}
.brief ul{margin:0;padding-left:18px;display:grid;gap:6px}
.tomorrow{margin-top:14px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.tomorrow h3{font:600 15px var(--f-display);margin:0 0 6px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.time{font:500 12px var(--f-mono);color:var(--muted);min-width:46px;padding-top:3px}
.meta{font-size:12.5px;color:var(--muted)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin-top:3px;flex:none}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.add{display:flex;gap:8px;margin-top:12px}
.add input[type=text]{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:600 13px var(--f-body);padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--muted);padding:2px 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--warn)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.skill{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.skill b{font:600 14px var(--f-display);display:block}
.skill span{font-size:12.5px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1 id="hello">Buenos días</h1>
    </div>
    <div class="stamp" id="stamp">Esperando primera actualización…</div>
  </header>

  <div class="grid">
    <section class="card brief span-12" aria-label="Resumen del día">
      <h2>Resumen del día</h2>
      <ul id="summary"></ul>
      <div class="tomorrow">
        <h3>Mañana</h3>
        <ul id="tomorrow" style="margin:0;padding-left:18px;display:grid;gap:6px"></ul>
      </div>
    </section>

    <section class="card span-6">
      <h2>Agenda de hoy</h2>
      <ul class="list" id="schedule"></ul>
    </section>

    <section class="card span-6">
      <h2>Correos importantes</h2>
      <ul class="list" id="emails"></ul>
    </section>

    <section class="card span-6">
      <h2>Tareas <span class="meta" id="taskCount"></span></h2>
      <ul class="list" id="tasks"></ul>
      <form class="add" id="taskForm"><input type="text" id="taskIn" placeholder="Nueva tarea" aria-label="Nueva tarea"><button>Añadir</button></form>
    </section>

    <section class="card span-6">
      <h2>Recordatorios</h2>
      <ul class="list" id="reminders"></ul>
      <form class="add" id="remForm"><input type="text" id="remIn" placeholder="Nuevo recordatorio (ej. Llamar al banco, viernes 10:00)" aria-label="Nuevo recordatorio"><button>Añadir</button></form>
    </section>

    <section class="card span-12">
      <h2>Herramientas conectadas</h2>
      <div class="chips" id="tools"></div>
    </section>

    <section class="card span-12">
      <h2>Mis skills</h2>
      <div class="skills" id="skills"></div>
    </section>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  var now=new Date();
  $("date").textContent=now.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
  var h=now.getHours();
  $("hello").textContent=(h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches")+"";

  function fill(ul,items,emptyMsg,build){
    ul.textContent="";
    if(!items.length){var li=el("li","empty",emptyMsg);ul.appendChild(li);return}
    items.forEach(function(it){ul.appendChild(build(it))});
  }
  function bullets(ul,arr,msg){fill(ul,arr||[],msg,function(s){return el("li",null,s)})}

  var db=null;
  function checkRow(coll,d){
    var li=el("li","row"+(d.done?" done":""));
    var cb=el("input");cb.type="checkbox";cb.checked=!!d.done;cb.setAttribute("aria-label","Marcar como hecha");
    cb.onchange=function(){db.collection(coll).doc(d.id).update({done:cb.checked}).catch(function(){})};
    var t=el("div","t");t.appendChild(el("div",null,d.title));
    if(d.due)t.appendChild(el("div","meta",d.due));
    var x=el("button","ghost","✕");x.setAttribute("aria-label","Eliminar");
    x.onclick=function(){db.collection(coll).doc(d.id).delete().catch(function(){})};
    li.append(cb,t,x);return li;
  }
  function docs(snap){return snap.docs.map(function(s){var d=s.data();d.id=s.id;return d})}

  function render(name,snap){
    var a=docs(snap);
    if(name==="tasks"){
      a.sort(function(x,y){return (x.done?1:0)-(y.done?1:0)||(x.createdAt||0)-(y.createdAt||0)});
      var open=a.filter(function(d){return !d.done}).length;
      $("taskCount").textContent=open+" pendientes";
      fill($("tasks"),a,"Sin tareas. Añade la primera abajo.",function(d){return checkRow("tasks",d)});
    }else if(name==="reminders"){
      a.sort(function(x,y){return (x.done?1:0)-(y.done?1:0)||(x.createdAt||0)-(y.createdAt||0)});
      fill($("reminders"),a,"Sin recordatorios.",function(d){return checkRow("reminders",d)});
    }else if(name==="schedule"){
      a.sort(function(x,y){return (x.time||"").localeCompare(y.time||"")});
      fill($("schedule"),a,"Sin eventos. Conecta Google Calendar para verlos aquí cada mañana.",function(d){
        var li=el("li","row");li.appendChild(el("div","time",d.time||""));
        var t=el("div","t");t.appendChild(el("div",null,d.title));if(d.note)t.appendChild(el("div","meta",d.note));
        li.appendChild(t);return li});
    }else if(name==="emails"){
      a.sort(function(x,y){return (y.order||0)-(x.order||0)});
      fill($("emails"),a,"Sin correos destacados. Conecta Gmail para que se llene solo.",function(d){
        var li=el("li","row");var t=el("div","t");
        t.appendChild(el("div",null,d.subject));t.appendChild(el("div","meta",(d.from||"")+(d.why?" · "+d.why:"")));
        li.appendChild(t);if(d.time)li.appendChild(el("div","time",d.time));return li});
    }else if(name==="skills"){
      var box=$("skills");box.textContent="";
      if(!a.length){box.appendChild(el("div","empty","Sin skills registradas."));return}
      a.sort(function(x,y){return (x.name||"").localeCompare(y.name||"")});
      a.forEach(function(d){var s=el("div","skill");s.appendChild(el("b",null,d.name));s.appendChild(el("span",null,d.desc||""));box.appendChild(s)});
    }else if(name==="tools"){
      var tb=$("tools");tb.textContent="";
      if(!a.length){tb.appendChild(el("div","empty","Sin herramientas registradas."));return}
      a.sort(function(x,y){return (x.name||"").localeCompare(y.name||"")});
      a.forEach(function(d){var c=el("div","chip");c.appendChild(el("span","dot"+(d.status==="connected"?"":" off")));c.appendChild(el("span",null,d.name));tb.appendChild(c)});
    }
  }

  function addForm(formId,inId,coll){
    $(formId).onsubmit=function(e){
      e.preventDefault();
      var v=$(inId).value.trim();if(!v||!db)return;
      $(inId).value="";
      db.collection(coll).add({title:v,done:false,createdAt:Date.now()}).catch(function(){});
    };
  }

  function boot(){
    bullets($("summary"),[],"Todavía no hay resumen. Se genera cada mañana.");
    bullets($("tomorrow"),[],"El resumen de mañana aparece cada noche.");
    if(!window.claude||!claude.use)return;
    claude.use("db").then(function(d){
      if(!d)return;
      db=d;
      ["tasks","reminders","schedule","emails","skills","tools"].forEach(function(n){
        db.collection(n).onSnapshot(function(s){render(n,s)},function(){});
      });
      db.doc("briefing/today").onSnapshot(function(s){
        if(!s.exists)return;var b=s.data();
        bullets($("summary"),b.today,"Sin novedades para hoy.");
        bullets($("tomorrow"),b.tomorrow,"Nada previsto para mañana.");
        if(b.updatedAt)$("stamp").textContent="Actualizado "+new Date(b.updatedAt).toLocaleString("es",{weekday:"short",hour:"2-digit",minute:"2-digit"});
      },function(){});
      addForm("taskForm","taskIn","tasks");
      addForm("remForm","remIn","reminders");
    });
  }
  boot();
})();
</script>
